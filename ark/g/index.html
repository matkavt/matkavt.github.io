<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бункер: Ковчег — вас зовут в партию</title>
<meta name="description" content="Игра для компании: мест в бункере меньше, чем вас.">
<meta property="og:title" content="Бункер: Ковчег — вас зовут в партию">
<meta property="og:description" content="Мест в бункере меньше, чем вас. Поставьте игру и войдите по коду.">
<meta name="apple-itunes-app" content="app-id=6801599101">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<!--
  Сюда попадают по ссылке https://matkavt.github.io/ark/g/?c=КОД, у кого игры НЕТ.
  У кого есть — телефон открывает приложение сразу, и эту страницу не видит
  (apple-app-site-association и .well-known/assetlinks.json в корне сайта).

  Страница ничего не хранит и никуда не ходит: код берётся из адреса, как есть.
  Пути /ark/g — контракт с приложением, см. lib/core/join_link.dart в Shelter.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #121110; color: #f2ebdc;
    font: 17px/1.45 "PT Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  .stripe { height: 10px; background: repeating-linear-gradient(-45deg, #f5c31e 0 10px, transparent 10px 20px); }
  main { width: 100%; max-width: 26rem; margin: 0 auto; padding: 2.2rem 1.5rem 1.5rem; flex: 1; display: flex; flex-direction: column; }
  .mark { width: 84px; height: 84px; border-radius: 20px; background: #f5c31e; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; }
  .brand { font: 600 .95rem "Oswald", sans-serif; letter-spacing: .2em; color: #9c917c; text-align: center; }
  h1 { font: 700 2.1rem/1.05 "Oswald", sans-serif; text-align: center; margin: .5rem 0 .6rem; text-transform: uppercase; }
  .lead { color: #c8bfac; text-align: center; margin: 0; }
  .code { margin: 1.6rem 0 0; padding: 1rem; border-radius: 14px; background: #201d18; text-align: center; }
  .code small { display: block; font-size: .75rem; letter-spacing: .12em; color: #9c917c; }
  .code b { display: block; font: 700 2.7rem "Oswald", sans-serif; letter-spacing: .12em; color: #f5c31e; margin: .15rem 0 .5rem; }
  button, .store { font-family: inherit; cursor: pointer; }
  .copy { height: 42px; padding: 0 1.1rem; border-radius: 8px; border: 1.5px solid #f5c31e; background: transparent; color: #f2ebdc; font-weight: 700; font-size: .95rem; }
  .stores { display: flex; flex-direction: column; gap: .65rem; margin-top: 1.5rem; }
  .store { height: 56px; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none;
           font: 700 1.15rem "Oswald", sans-serif; letter-spacing: .05em; border: 2px solid #f5c31e; color: #f2ebdc; }
  .store.primary { background: #f5c31e; color: #121110; }
  .note { margin-top: auto; padding-top: 1.5rem; font-size: .85rem; color: #9c917c; text-align: center; }
  .hidden { display: none; }
  a:focus-visible, button:focus-visible { outline: 3px solid #f2ebdc; outline-offset: 2px; }
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#121110" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>
  </div>
  <div class="brand" data-t="brand">БУНКЕР: КОВЧЕГ</div>
  <h1 data-t="title">Вас зовут в партию</h1>
  <p class="lead" data-t="lead">Мест в бункере меньше, чем вас. Поставьте игру — и откройте эту ссылку ещё раз, или введите код.</p>

  <div class="code" id="codeBox">
    <small data-t="codeLabel">КОД ПАРТИИ</small>
    <b id="code">—</b>
    <button class="copy" id="copy" type="button" data-t="copy">Скопировать код</button>
  </div>

  <div class="stores" id="stores">
    <a class="store" id="appstore" href="https://apps.apple.com/app/id6801599101" data-t="appstore">Скачать в App Store</a>
    <a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.matkavt.shelter&amp;referrer=utm_source%3Djoin_link" data-t="play">Скачать в Google Play</a>
  </div>

  <p class="note" data-t="note">Интернет нужен только чтобы скачать. Играть можно без сети — вся партия собирается из кода.</p>
</main>
<script>
(function () {
  var en = !/^(ru|uk|be|kk)/i.test(navigator.language || '');
  var T = {
    brand: 'BUNKER: ARK', title: 'You’re invited to a match',
    lead: 'There are fewer places in the bunker than there are of you. Install the game, then open this link again or enter the code.',
    codeLabel: 'MATCH CODE', copy: 'Copy code', copied: 'Copied',
    appstore: 'Get it on the App Store', play: 'Get it on Google Play',
    note: 'You only need the internet to download. The game itself works offline — the whole match is built from the code.'
  };
  if (en) {
    document.documentElement.lang = 'en';
    document.title = 'Bunker: Ark — you’re invited';
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var k = el.getAttribute('data-t'); if (T[k]) el.textContent = T[k];
    });
  }

  // Код из адреса: принимаем то же, что приложение, — регистр, дефис и пробелы
  // прощаем, но показываем только если похоже на код (8 символов base32).
  var raw = new URLSearchParams(location.search).get('c') || '';
  var clean = raw.toUpperCase().replace(/[\s-]/g, '');
  var box = document.getElementById('codeBox');
  if (/^[0-9A-Z]{8}$/.test(clean)) {
    document.getElementById('code').textContent = clean.slice(0, 4) + '-' + clean.slice(4);
  } else {
    box.classList.add('hidden');   // приглашение без кода: просто «сыграйте и вы»
  }

  document.getElementById('copy').addEventListener('click', function () {
    var btn = this, text = document.getElementById('code').textContent;
    var done = function () { btn.textContent = en ? T.copied : 'Скопировано'; };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () {});
  });

  // Нужный магазин — первым и залитым.
  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  var stores = document.getElementById('stores');
  var mine = document.getElementById(android ? 'play' : 'appstore');
  if (android || ios) {
    mine.classList.add('primary');
    stores.insertBefore(mine, stores.firstChild);
  } else {
    document.getElementById('appstore').classList.add('primary');
  }
})();
</script>
</body>
</html>
